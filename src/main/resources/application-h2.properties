# ---- Base de datos H2 en memoria (solo desarrollo) ----
spring.datasource.url=jdbc:h2:mem:foodidb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades del paquete "domain"
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (requiere el módulo spring-boot-h2console en Spring Boot 4)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
