spring.application.name=demo
server.port=8080

# Perfil activo. Hoy usamos H2 en memoria para arrancar sin instalar nada.
# Cuando definan la base de datos real con el profesor: crear application-<motor>.properties
# (postgres, mysql...) y cambiar este valor.
spring.profiles.active=h2

# Evita consultas perezosas fuera de la capa de servicio
spring.jpa.open-in-view=false

# La sesión (login) dura 8 horas de inactividad
server.servlet.session.timeout=8h
